databases:
  - name: expense-splitter-db
    plan: free
    databaseName: expense_splitter
    user: expense_user

services:
  - type: web
    name: expense-splitter-backend
    runtime: docker
    plan: free
    rootDir: ./backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: RENDER_DATASOURCE_URL
        fromDatabase:
          name: expense-splitter-db
          property: connectionString
      - key: RENDER_DATASOURCE_USERNAME
        fromDatabase:
          name: expense-splitter-db
          property: user
      - key: RENDER_DATASOURCE_PASSWORD
        fromDatabase:
          name: expense-splitter-db
          property: password
      - key: JWT_SECRET
        generateValue: true
