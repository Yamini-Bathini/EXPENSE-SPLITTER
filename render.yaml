databases:
  - name: expense-splitter-db
    plan: free
    databaseName: expense_splitter
    user: expense_user

services:
  - type: web
    name: expense-splitter-backend
    runtime: docker
    plan: free
    rootDir: ./backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PGHOST
        fromDatabase:
          name: expense-splitter-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: expense-splitter-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: expense-splitter-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: expense-splitter-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: expense-splitter-db
          property: password
      - key: JWT_SECRET
        generateValue: true

  - type: cronJob
    name: keep-awake
    runtime: docker
    rootDir: ./backend
    dockerfilePath: ./Dockerfile.cron
    schedule: "*/5 * * * *"
    plan: free
    command: curl -sf https://expense-splitter-backend-yqdk.onrender.com/api/health
